<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SCADA Cyber Defender - Terminal</title>
    <style>
        /* CRT & RETRO EFFECTS */
        body {
            background-color: #050505;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 4px #00bb00;
            /* Default Low Glow */
        }

        #gameContainer {
            width: 960px;
            height: 540px;
            position: relative;
            background: #000;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.1);
            overflow: hidden;
            /* Contain scanlines */
        }

        /* Scanline Overlay */
        #gameContainer::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* Screen Flicker Animation */
        @keyframes flicker {
            0% {
                opacity: 0.97;
            }

            5% {
                opacity: 0.95;
            }

            10% {
                opacity: 0.9;
            }

            15% {
                opacity: 0.95;
            }

            20% {
                opacity: 0.99;
            }

            50% {
                opacity: 0.95;
            }

            80% {
                opacity: 0.9;
            }

            100% {
                opacity: 0.97;
            }
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            color: #00bb00;
            font-family: 'Courier New', Courier, monospace;
            z-index: 10;
            animation: flicker 0.15s infinite;
        }

        /* ... Existing Styles ... */

        .panel {
            border: 2px solid #00bb00;
            padding: 20px;
            background: #000;
            width: 80%;
            height: 80%;
            max-height: 80%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 15px #00bb00, inset 0 0 10px #00bb00;
            /* Increased Glow */
            overflow: hidden;
            position: relative;
        }

        /* Tech Corners (Simple CSS trick) */
        .panel::after {
            content: "";
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background:
                linear-gradient(to right, #00bb00 2px, transparent 2px) 0 0,
                linear-gradient(to bottom, #00bb00 2px, transparent 2px) 0 0,
                linear-gradient(to left, #00bb00 2px, transparent 2px) 100% 0,
                linear-gradient(to bottom, #00bb00 2px, transparent 2px) 100% 0,
                linear-gradient(to left, #00bb00 2px, transparent 2px) 100% 100%,
                linear-gradient(to top, #00bb00 2px, transparent 2px) 100% 100%,
                linear-gradient(to right, #00bb00 2px, transparent 2px) 0 100%,
                linear-gradient(to top, #00bb00 2px, transparent 2px) 0 100%;
            background-size: 20px 20px;
            background-repeat: no-repeat;
            pointer-events: none;
            z-index: 1;
        }

        .panel-header {
            border-bottom: 2px dashed #00bb00;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        h1,
        h2,
        h3 {
            text-shadow: 0 0 8px #00ff00;
        }

        button {
            background: #000;
            color: #00bb00;
            border: 1px solid #00bb00;
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
            margin: 5px;
            text-transform: uppercase;
            box-shadow: 0 0 5px #00bb00;
            transition: all 0.1s;
        }

        button:hover {
            background: #00bb00;
            color: #000;
            box-shadow: 0 0 15px #00ff00;
            text-shadow: none;
        }

        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            border-bottom: 1px dotted #333;
            padding-bottom: 5px;
        }

        input,
        select {
            background: #050505;
            color: #00ff00;
            border: 1px solid #00bb00;
            padding: 5px;
            font-family: inherit;
            box-shadow: 0 0 2px #00bb00;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="960" height="540"></canvas>
        <div id="ui-layer" class="hidden"></div>
    </div>

    <script src="src/states.js"></script>
    <script src="src/intro.js"></script>
    <script src="src/story.js"></script>
    <script src="src/mainPage.js"></script>
    <script src="src/substation.js"></script>
    <script src="src/substation.js"></script>
    <script src="src/phases/inventory.js"></script>
    <script src="src/phases/inventory.js"></script>
    <script src="src/phases/patching.js"></script>
    <script src="src/phases/inventory.js"></script>
    <script src="src/phases/patching.js"></script>
    <script src="src/phases/access.js"></script>
    <script src="src/phases/bcm.js"></script>
    <script src="src/main.js"></script>
    <script>
        // Full Window Scaling Logic
        function resizeGame() {
            const gameContainer = document.getElementById("gameContainer");
            const width = 960;
            const height = 540;
            const aspect = width / height;
            const windowAspect = window.innerWidth / window.innerHeight;

            let scale;

            if (windowAspect < aspect) {
                // Window is taller than game aspect -> fit width
                scale = window.innerWidth / width;
            } else {
                // Window is wider than game aspect -> fit height
                scale = window.innerHeight / height;
            }

            // Apply Scale
            gameContainer.style.transform = `scale(${scale})`;
            gameContainer.style.transformOrigin = "center";

            // Store scale globally for mouse correction if needed (main.js handles robust rect checks usually)
            window.gameScale = scale;
        }

        window.addEventListener("resize", resizeGame);
        // Initial Call
        resizeGame();
    </script>
</body>

</html>
