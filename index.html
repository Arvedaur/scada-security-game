<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SCADA Cyber Defender - Terminal</title>
    <style>
        body {
            background-color: #000;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }

        #gameContainer {
            width: 960px;
            height: 540px;
            position: relative;
            background: #000;
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            color: #00bb00;
            font-family: 'Courier New', Courier, monospace;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        /* Common UI Elements */
        .panel {
            border: 2px solid #00bb00;
            padding: 20px;
            background: #000;
            width: 80%;
            max-height: 80%;
            overflow-y: auto;
            box-shadow: 0 0 10px #00bb00;
        }

        h2 {
            border-bottom: 1px dashed #00bb00;
            padding-bottom: 10px;
            margin-top: 0;
        }

        button {
            background: #000;
            color: #00bb00;
            border: 1px solid #00bb00;
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
            margin: 5px;
            text-transform: uppercase;
        }

        button:hover {
            background: #00bb00;
            color: #000;
        }

        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            border-bottom: 1px dotted #333;
            padding-bottom: 5px;
        }

        input,
        select {
            background: #111;
            color: #00ff00;
            border: 1px solid #00bb00;
            padding: 5px;
            font-family: inherit;
        }
    </style>
</head>

<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="960" height="540"></canvas>
        <div id="ui-layer" class="hidden"></div>
    </div>

    <script src="src/states.js"></script>
    <script src="src/intro.js"></script>
    <script src="src/story.js"></script>
    <script src="src/mainPage.js"></script>
    <script src="src/substation.js"></script>
    <script src="src/substation.js"></script>
    <script src="src/phases/inventory.js"></script>
    <script src="src/phases/inventory.js"></script>
    <script src="src/phases/patching.js"></script>
    <script src="src/phases/inventory.js"></script>
    <script src="src/phases/patching.js"></script>
    <script src="src/phases/access.js"></script>
    <script src="src/phases/bcm.js"></script>
    <script src="src/main.js"></script>
</body>

</html>
