<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SCADA Cyber Defender - Terminal</title>
    <style>
        :root {
            --bg-dark: #050510;
            --panel-bg: rgba(5, 5, 20, 0.85);
            --neon-cyan: #00fbff;
            --neon-magenta: #ff00ff;
            --neon-yellow: #ffae00;
            --neon-red: #ff2d44;
            --retro-green: #39ff14;
            --glow-strength: 15px;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            color: var(--neon-cyan);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            background-image:
                radial-gradient(circle at 50% 50%, rgba(0, 251, 255, 0.05) 0%, transparent 80%),
                linear-gradient(0deg, transparent 24%, rgba(0, 251, 255, 0.02) 25%, rgba(0, 251, 255, 0.02) 26%, transparent 27%, transparent 74%, rgba(0, 251, 255, 0.02) 75%, rgba(0, 251, 255, 0.02) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(0, 251, 255, 0.02) 25%, rgba(0, 251, 255, 0.02) 26%, transparent 27%, transparent 74%, rgba(0, 251, 255, 0.02) 75%, rgba(0, 251, 255, 0.02) 76%, transparent 77%, transparent);
            background-size: 100% 100%, 50px 50px, 50px 50px;
        }

        #gameContainer {
            position: absolute;
            width: 1920px;
            height: 1080px;
            background: #000;
            border: 4px solid #39ff14;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.4);
            transform-origin: center center;
            left: 50%;
            top: 50%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        canvas {
            display: block;
            background: #000;
            width: 100%;
            height: 100%;
        }

        /* Scanline / CRT Effect Overlays */
        #crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%;
            z-index: 100;
        }

        /* Screen Flicker Animation */
        @keyframes flicker {
            0% {
                opacity: 0.97;
            }

            5% {
                opacity: 0.95;
            }

            10% {
                opacity: 0.9;
            }

            15% {
                opacity: 0.95;
            }

            20% {
                opacity: 0.99;
            }

            50% {
                opacity: 0.95;
            }

            80% {
                opacity: 0.9;
            }

            100% {
                opacity: 0.97;
            }
        }

        /* UI Layer for Panels */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            animation: flicker 0.15s infinite;
        }

        .hidden {
            display: none !important;
        }

        .panel {
            border: 2px solid #00bb00;
            padding: 20px;
            background: #000;
            width: 80%;
            height: 80%;
            max-height: 80%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 15px #00bb00, inset 0 0 10px #00bb00;
            /* Increased Glow */
            overflow: hidden;
            position: relative;
        }

        /* Tech Corners (Simple CSS trick) */
        .panel::after {
            content: "";
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background:
                linear-gradient(to right, #00bb00 2px, transparent 2px) 0 0,
                linear-gradient(to bottom, #00bb00 2px, transparent 2px) 0 0,
                linear-gradient(to left, #00bb00 2px, transparent 2px) 100% 0,
                linear-gradient(to bottom, #00bb00 2px, transparent 2px) 100% 0,
                linear-gradient(to left, #00bb00 2px, transparent 2px) 100% 100%,
                linear-gradient(to top, #00bb00 2px, transparent 2px) 100% 100%,
                linear-gradient(to right, #00bb00 2px, transparent 2px) 0 100%,
                linear-gradient(to top, #00bb00 2px, transparent 2px) 0 100%;
            background-size: 20px 20px;
            background-repeat: no-repeat;
            pointer-events: none;
            z-index: 1;
        }

        .panel-header {
            border-bottom: 2px dashed #00bb00;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        h1,
        h2,
        h3 {
            text-shadow: 0 0 8px #00ff00;
        }

        button {
            background: #000;
            color: #00bb00;
            border: 1px solid #00bb00;
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
            margin: 5px;
            text-transform: uppercase;
            box-shadow: 0 0 5px #00bb00;
            transition: all 0.1s;
        }

        button:hover {
            background: #00bb00;
            color: #000;
            box-shadow: 0 0 15px #00ff00;
            text-shadow: none;
        }

        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            border-bottom: 1px dotted #333;
            padding-bottom: 5px;
        }

        input,
        select {
            background: #050505;
            color: #00ff00;
            border: 1px solid #00bb00;
            padding: 5px;
            font-family: inherit;
            box-shadow: 0 0 2px #00bb00;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1920" height="1080"></canvas>
        <div id="ui-layer" class="hidden"></div>
        <div id="alert-banner" class="hidden"></div>
    </div>

    <script src="src/states.js"></script>
    <script src="src/intro.js"></script>
    <script src="src/story.js"></script>
    <script src="src/scadaIntro.js"></script>
    <script src="src/mainPage.js"></script>
    <script src="src/substation.js"></script>
    <script src="src/helpContent.js"></script>
    <script src="src/phases/inventory.js"></script>
    <script src="src/phases/patching.js"></script>
    <script src="src/phases/access.js"></script>
    <script src="src/phases/ids.js"></script>
    <script src="src/phases/bcm.js"></script>
    <script src="src/phases/phishing.js"></script>
    <script src="src/phases/results.js"></script>
    <script src="src/opgw.js"></script>
    <script src="src/main.js"></script>
    <script>
        // Full Window Scaling Logic
        function resizeGame() {
            const gameContainer = document.getElementById("gameContainer");
            const width = 1920;
            const height = 1080;
            const aspect = width / height;
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const windowAspect = windowWidth / windowHeight;

            let scale;

            if (windowAspect < aspect) {
                // Window is taller than game aspect -> fit width
                scale = windowWidth / width;
            } else {
                // Window is wider than game aspect -> fit height
                scale = windowHeight / height;
            }

            // Apply Scale and Manual Centering via Translation
            gameContainer.style.transform = `translate(-50%, -50%) scale(${scale})`;

            // Store scale globally for mouse correction
            window.gameScale = scale;
        }

        window.addEventListener("resize", resizeGame);
        // Initial Call
        resizeGame();
    </script>
</body>

</html>
